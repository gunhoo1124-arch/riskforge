[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riskforge"
version = "0.1.2"
description = "A Monte Carlo market-risk engine built on historical bootstrap simulation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Gunho" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "rich>=13.9",
    "scikit-learn>=1.9.1",
    "scipy>=1.14",
    "streamlit>=1.57",
    "typer>=0.12",
    "yfinance>=0.2.54",
]

[project.urls]
Homepage = "https://github.com/gunhoo1124-arch/riskforge"
Repository = "https://github.com/gunhoo1124-arch/riskforge"
Issues = "https://github.com/gunhoo1124-arch/riskforge/issues"

[project.scripts]
riskforge = "riskforge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/riskforge"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
